name: CI

on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch:

permissions:
  contents: read


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-24.04
    timeout-minutes: 10


    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: apps/api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependency files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"


          if [ -n "${files}" ]; then
            echo "The following files require gofmt:"
            echo "${files}"
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Show coverage
        run: go tool cover -func=coverage.out

      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.out
          if-no-files-found: error
          retention-days: 14

  web:

    name: React Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

      - name: Validate OpenAPI document
        working-directory: .
        run: npx --yes @redocly/cli@1.34.3 lint api/openapi.yaml

  containers:
    name: Container Builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=trade_journal
          POSTGRES_USER=trade_journal
          POSTGRES_PASSWORD=ci-trade-journal-password
          DATABASE_URL=postgres://trade_journal:ci-trade-journal-password@postgres:5432/trade_journal?sslmode=disable
          API_PORT=8081
          WEB_PORT=8080
          VITE_API_PROXY_TARGET=http://api:8080
          EOF

      - name: Build production-like containers
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            build

      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            config --quiet


  integration:
    name: Lifecycle Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4


      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=trade_journal
          POSTGRES_USER=trade_journal
          POSTGRES_PASSWORD=ci-trade-journal-password
          DATABASE_URL=postgres://trade_journal:ci-trade-journal-password@postgres:5432/trade_journal?sslmode=disable
          API_PORT=8081
          WEB_PORT=5173
          VITE_API_PROXY_TARGET=http://api:8080
          EOF

      - name: Start database, migrations, and API
        run: |
          docker compose \
            --env-file .env \
            -f compose.dev.yaml \
            up \
            --build \
            --detach \
            postgres \
            migrate \
            api


      - name: Wait for migration container
        run: |
          docker compose \
              --env-file .env \
              -f compose.dev.yaml \
              ps \
              --quiet \
              migrate
          sleep 30

          exit_code="$(docker wait "${migration_id}")"

          if [ "${exit_code}" != "0" ]; then
            docker logs "${migration_id}"
            exit "${exit_code}"
          fi


      - name: Run lifecycle smoke test
        env:
          API_URL: http://localhost:8081

          COMPOSE_FILE: compose.dev.yaml

          ENV_FILE: .env
        run: ./scripts/smoke-test.sh

      - name: Show service state
        if: always()
        run: |
          docker compose \
            --env-file .env \
            -f compose.dev.yaml \
            ps --all

      - name: Show service logs

        if: failure()
        run: |
          docker compose \
            --env-file .env \
            -f compose.dev.yaml \
            logs \
            --no-color \
            --tail 500

      - name: Stop integration environment
        if: always()
        run: |
          docker compose \
            --env-file .env \
            -f compose.dev.yaml \
            down \
            --volumes \
            --remove-orphans

