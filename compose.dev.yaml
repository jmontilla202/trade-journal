name: trade-journal-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_journal}
      POSTGRES_USER: ${POSTGRES_USER:-trade_journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-trade_journal} -d ${POSTGRES_DB:-trade_journal}
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - development

  migrate:
    build:
      context: ./apps/api
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://trade_journal:local-development-password@postgres:5432/trade_journal?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - development

  api:
    build:
      context: ./apps/api
      target: development
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      APP_TIMEZONE: ${APP_TIMEZONE:-America/New_York}
      DATABASE_URL: ${DATABASE_URL:-postgres://trade_journal:local-development-password@postgres:5432/trade_journal?sslmode=disable}
    command: ["go", "run", "./cmd/server"]
    volumes:
      - ./apps/api:/workspace
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    networks:
      - development

  web:
    build:
      context: ./apps/web
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    volumes:
      - ./apps/web:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      - api
    ports:
      - "5173:5173"
    networks:
      - development

volumes:
  postgres_dev_data:
  go_modules:
  go_build_cache:
  web_node_modules:

networks:
  development:
    driver: bridge

