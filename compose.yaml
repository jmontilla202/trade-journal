name: trade-journal

services:


  postgres:
    image: postgres:17-alpine
    environment:

      POSTGRES_DB: ${POSTGRES_DB:-trade_journal}
      POSTGRES_USER: ${POSTGRES_USER:-trade_journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-trade_journal} -d ${POSTGRES_DB:-trade_journal}
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

    networks:
      - backend

  migrate:
    build:
      context: ./apps/api
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"


  api:
    build:
      context: ./apps/api

      target: production
    environment:

      APP_ENV: ${APP_ENV:-production}

      APP_PORT: "8080"
      APP_TIMEZONE: ${APP_TIMEZONE:-America/New_York}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: [CMD, /app/server, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true

    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:

      - ALL
    restart: unless-stopped
    networks:
      - backend

  web:

    build:
      context: ./apps/web
      target: production
    depends_on:
      api:

        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge

