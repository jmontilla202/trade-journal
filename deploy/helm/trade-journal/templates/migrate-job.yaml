apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "trade-journal.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "trade-journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "trade-journal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              until pg_isready \
                --host="{{ include "trade-journal.fullname" . }}-postgres" \
                --port="{{ .Values.database.port }}" \

                --username="$POSTGRES_USER" \
                --dbname="$POSTGRES_DB"; do
                echo "Waiting for PostgreSQL..."
                sleep 2

              done
          envFrom:
            - secretRef:
                name: {{ include "trade-journal.secretName" . }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          args:
            {{- toYaml .Values.migration.args | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "trade-journal.secretName" . }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

